services:
  web:
    environment:
      ORIGIN: https://www.inceptchange.com
  proxy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  caddy_data:
  caddy_config:
